<!-- 팝업 · 실습용 페이지 안내 (modal + scrim). 메인 접속 시 가장 먼저 표시, 닫으면 다음 팝업(신규 천연기념물 지정)이 이어서 열림. 동작: src/scripts/popup.js -->
<div class="scrim" data-popup="" data-popup-key="disclaimer">
<div aria-describedby="disclaimer-desc" aria-labelledby="disclaimer-title" aria-modal="true" class="modal modal--notice" role="dialog">
<button aria-label="팝업 닫기" class="icon-btn modal__close" data-i18n-attr="aria-label:common.056" data-popup-close="" type="button">{{icon:close}}</button>
<div class="modal__body modal__body--notice">
<h2 class="modal__title" data-i18n="popup-disclaimer.001" id="disclaimer-title">해당 사이트는 UX/UI 디자인 실습용 페이지입니다.</h2>
<div class="modal__text" id="disclaimer-desc">
<p data-i18n="popup-disclaimer.002">절대 대한민국의 공식 사이트가 아니므로 주의해주시길 바랍니다.</p>
<p data-i18n="popup-disclaimer.003">또한, 내부에 있는 자료는 실제 데이터를 기반으로 했기 때문에 연락이나 자료 활용에 있어서도 주의해주시길 바랍니다.</p>
</div>
</div>
<div class="modal__actions">
<button class="btn btn--tertiary" data-i18n="common.057" data-popup-hide-today="" type="button">오늘 하루 보지 않기</button>
<!-- TODO: '자세히 보기'의 이동 대상이 Figma에 정의되어 있지 않음. 지금은 팝업만 닫음. 대상 페이지가 정해지면 <a href> 로 교체 -->
<button class="btn btn--primary" data-i18n="common.017" data-popup-close="" type="button">자세히 보기</button>
</div>
</div>
</div>
