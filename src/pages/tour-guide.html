<!doctype html>
<html lang="ko">
  <head>
    <!--@include head-->
    <title>해설안내 | 천연기념물센터</title>
    <meta name="description" content="전문 해설사와 함께하는 전시 해설 프로그램을 안내합니다." />
  </head>
  <body>
    <!--@include header-->

    <main id="main">
      <section class="page-hero page-hero--s" aria-label="천연기념물센터 소개 배너">
        <img class="page-hero__bg" src="./images/hero/lobby-960.webp" srcset="./images/hero/lobby-960.webp 960w, ./images/hero/lobby.webp 1920w" sizes="100vw" width="1920" height="332" alt="" fetchpriority="high" />
        <div class="page-hero__box">
          <p class="page-hero__en">Natural Heritage Center</p>
          <p>국내 유일의 자연유산 전문 전시관</p>
          <p class="page-hero__name">천연기념물센터</p>
        </div>
      </section>

      <div class="container sub-body">
        <div class="page-title"><h1>해설안내</h1></div>
        <div class="sub-content">
          <section class="intro-box"><h2>전문 해설사와 함께하는 전시 해설</h2><span class="intro-box__bar" aria-hidden="true"></span><p>전시를 더 깊이 이해할 수 있도록 해설사가 전시존을 안내해 드려요.</p></section>
          <section aria-labelledby="t-prog"><h2 class="sub-h2" id="t-prog">해설 프로그램</h2><ul class="cards cards--3"><li class="card"><h3>운영 시간</h3><p>평일 11:00, 14:00 (회차별 약 40분)</p></li><li class="card"><h3>대상</h3><p>일반 관람객 누구나</p></li><li class="card"><h3>신청 방법</h3><p>현장 접수 또는 전화 문의</p></li></ul></section>
          <section aria-labelledby="t-use"><h2 class="sub-h2" id="t-use">이용 안내</h2><div class="textbox">- 단체 해설은 방문 7일 전까지 신청해 주세요.<br />- 해설 시간은 운영 상황에 따라 변경될 수 있어요.</div></section>
        </div>
      </div>
    </main>

    <!--@include footer-->
    <script type="module" src="../scripts/sub.js"></script>
