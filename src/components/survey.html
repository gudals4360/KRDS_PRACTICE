<!-- 만족도 조사 (KRDS: radio + input + button). 저장 기능 없음: 화면 UI만 -->
<section aria-labelledby="survey-q" class="survey">
<form class="survey__form" onsubmit="return false">
<div class="survey__head">
<h2 class="survey__q" data-i18n="survey.001" id="survey-q">이 페이지의 정보와 사용편의성에 만족하시나요?</h2>
<fieldset class="radio-group">
<legend class="sr-only" data-i18n="survey.002">만족도 선택</legend>
<label class="radio"><input name="satisfaction" type="radio" value="5"/><span data-i18n="survey.003">매우만족</span></label>
<label class="radio"><input name="satisfaction" type="radio" value="4"/><span data-i18n="survey.004">만족</span></label>
<label class="radio"><input checked="" name="satisfaction" type="radio" value="3"/><span data-i18n="survey.005">보통</span></label>
<label class="radio"><input name="satisfaction" type="radio" value="2"/><span data-i18n="survey.006">불만족</span></label>
<label class="radio"><input name="satisfaction" type="radio" value="1"/><span data-i18n="survey.007">매우불만족</span></label>
</fieldset>
</div>
<div class="survey__row">
<label class="sr-only" data-i18n="survey.008" for="survey-opinion">의견</label>
<input class="input" data-i18n-attr="placeholder:survey.009" id="survey-opinion" placeholder="여러분의 소중한 의견을 남겨주세요." type="text"/>
<button class="btn btn--gray" data-i18n="survey.010" type="submit">확인</button>
</div>
</form>
</section>
